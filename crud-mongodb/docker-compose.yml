services:
  mongo:
    image: mongo:7
    container_name: mongo-docker
    restart: unless-stopped
    ports:
      - "27018:27017"        # 27018 en tu PC, para no chocar con Mongo local (27017)
    environment:
      MONGO_INITDB_DATABASE: ${DB_NAME:-tecnomarket}
    volumes:
      - mongo-data:/data/db
      - ./seed:/docker-entrypoint-initdb.d:ro   # se ejecuta solo la primera vez
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: crud-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://mongo:27017      # dentro de Docker se usa el puerto interno
      DB_NAME: ${DB_NAME:-tecnomarket}
      PORT: 3000
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
